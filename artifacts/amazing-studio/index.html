<!DOCTYPE html>
<html lang="vi" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Amazing Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #app-boot-fallback{min-height:100vh;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:24px;background:#faf7f2;color:#17130f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
      #app-boot-card{width:min(92vw,420px);box-sizing:border-box;padding:28px 24px;border:1px solid #eadfd3;border-radius:18px;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center}
      #app-boot-mark{display:grid;place-items:center;width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:#17130f;color:#fff;font-size:27px}
      #app-boot-title{margin:0 0 8px;font-size:21px}#app-boot-status{margin:0;color:#6b6257;line-height:1.5}
      #app-boot-actions{margin-top:18px}#app-boot-reload{width:100%;box-sizing:border-box;padding:12px 16px;border:0;border-radius:10px;background:#b8860b;color:#fff;font:600 16px inherit;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="root">
      <main id="app-boot-fallback" role="status" aria-live="polite">
        <section id="app-boot-card">
          <div id="app-boot-mark" aria-hidden="true">📷</div>
          <h1 id="app-boot-title">Amazing Studio</h1>
          <p id="app-boot-status">Đang mở giao diện…</p>
          <div id="app-boot-actions" hidden>
            <button id="app-boot-reload" type="button">Tải lại sạch</button>
          </div>
        </section>
      </main>
    </div>
    <script>
      (function () {
        window.__amazingBootTimer = window.setTimeout(function () {
          var status = document.getElementById("app-boot-status");
          var actions = document.getElementById("app-boot-actions");
          if (status) status.textContent = "Giao diện đang tải lâu hơn bình thường. Bấm Tải lại sạch để tự khắc phục.";
          if (actions) actions.hidden = false;
        }, 8000);

        window.__amazingCleanReload = async function () {
          var button = document.getElementById("app-boot-reload");
          if (button) {
            button.disabled = true;
            button.textContent = "Đang làm mới…";
          }
          try {
            if ("serviceWorker" in navigator) {
              var registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
            }
            if ("caches" in window) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }
          } catch (_) {}
          var url = new URL(window.location.href);
          url.searchParams.set("app_refresh", String(Date.now()));
          window.location.replace(url.toString());
        };

        document.getElementById("app-boot-reload").addEventListener("click", window.__amazingCleanReload);
      })();
    </script>
    <noscript>Trình duyệt cần bật JavaScript để sử dụng Amazing Studio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
