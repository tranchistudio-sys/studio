# fly.toml — cấu hình BẢN XEM THỬ theo Pull Request.
#
# Tên app ở đây chỉ là mặc định; workflow .github/workflows/pr-preview.yml luôn
# truyền --app pr-<số PR>-amazing-studio nên MỖI PR CÓ MỘT APP RIÊNG, URL riêng,
# và bị xoá hẳn khi PR đóng.
#
# Production KHÔNG dùng file này (production vẫn ở Replit).

app = "amazing-studio-preview"
primary_region = "sin"   # Singapore — gần Việt Nam nhất

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Bật toàn bộ chốt an toàn preview (xem artifacts/api-server/src/lib/preview-guard.ts).
  PREVIEW_MODE = "1"

# Các giá trị nhạy cảm (DATABASE_URL preview, SESSION_SECRET, mật khẩu xem thử,
# allowlist database) KHÔNG nằm trong file này — workflow nạp bằng `flyctl secrets set`.

[http_service]
  internal_port = 8080
  force_https = true
  # Không ai dùng thì máy tự ngủ → gần như không tốn tiền; có người mở link thì tự dậy.
  # "suspend" (ngủ đông, giữ RAM) chứ KHÔNG phải "stop": stop = tắt hẳn, lần mở sau
  # phải boot lại từ đầu (node + migration + chờ Neon thức) mất 15-30s → Fly proxy
  # hết kiên nhẫn, trả 503 body rỗng → người dùng thấy MÀN HÌNH TRẮNG (lỗi thật
  # 31/07, ảnh chụp iPhone của chủ). Suspend thức dậy trong ~1 giây, không boot lại.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # CỐ Ý KHÔNG có [[http_service.checks]] — bài học 31/07: máy tự ngủ (auto_stop)
  # trong lúc flyctl đang chờ health check → trạng thái khoẻ/ốm nhấp nháy →
  # deploy timeout vĩnh viễn. App xem thử 1 máy không cần Fly tự giám sát;
  # workflow CI đã tự curl /api/healthz qua proxy (lời gọi đó đánh thức máy)
  # để xác nhận sống thật trước khi báo PREVIEW READY.

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
