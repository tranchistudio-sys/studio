name: Diagnose booking update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read sanitized booking update errors
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H 160.250.128.162 > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@160.250.128.162 \
            "sudo -n docker compose -f /opt/amazing-studio/app/06_vps_deployment/docker-compose.yml -f /opt/amazing-studio/platform-auth.override.yml logs --since 15m --tail 500 web 2>&1 | grep -A 12 -B 2 'PUT /bookings/:id error' | tail -80"
