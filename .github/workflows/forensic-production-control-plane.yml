name: Forensic Production Control Plane

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type FORENSIC_READ_ONLY
        required: true

concurrency:
  group: amazing-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forensic:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: 160.250.128.162
      VPS_USER: deploy
      VPS_PORT: 22
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
    steps:
      - run: test "${{ inputs.confirm }}" = "FORENSIC_READ_ONLY"
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts"
      - name: Read-only runtime and filesystem forensic audit
        run: |
          set -euo pipefail
          scp -P "$VPS_PORT" -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/forensic-production-control-plane.sh "$VPS_USER@$VPS_HOST:/tmp/forensic-production-control-plane-$GITHUB_RUN_ID.sh"
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "bash /tmp/forensic-production-control-plane-$GITHUB_RUN_ID.sh; status=\$?; rm -f /tmp/forensic-production-control-plane-$GITHUB_RUN_ID.sh; exit \$status"
