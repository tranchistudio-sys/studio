name: Enable production Google auth

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ ENABLE_GOOGLE để xác nhận"
        required: true

concurrency:
  group: amazing-studio-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enable:
    name: Backup + platform DB + Google auth
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VPS_HOST: 160.250.128.162
      VPS_USER: deploy
      VPS_PORT: 22
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      GOOGLE_CLIENT_ID: 65788959851-t8edpkk8kql5ttpaln4nah5vjb4dumfb.apps.googleusercontent.com
      BOOTSTRAP_OWNER_EMAIL: tranchistudio@gmail.com
    steps:
      - name: Xác nhận thao tác một lần
        shell: bash
        run: |
          if [ "${{ inputs.confirm }}" != "ENABLE_GOOGLE" ]; then
            echo "::error::Phải gõ đúng ENABLE_GOOGLE"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Kiểm tra khóa SSH
        shell: bash
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY" || { echo "::error::Thiếu VPS_SSH_PRIVATE_KEY"; exit 1; }

      - name: Chuẩn bị SSH và migration package
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -H -p "$VPS_PORT" "$VPS_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          tar -czf "$RUNNER_TEMP/platform-migrations-$GITHUB_RUN_ID.tar.gz" \
            -C lib/platform-db/migrations .

      - name: Chép bộ bật Platform Auth lên VPS
        shell: bash
        run: |
          scp -P "$VPS_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/enable-production-platform-auth.sh \
            "$VPS_USER@$VPS_HOST:/tmp/enable-production-platform-auth-$GITHUB_RUN_ID.sh"
          scp -P "$VPS_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/platform-migrations-$GITHUB_RUN_ID.tar.gz" \
            "$VPS_USER@$VPS_HOST:/tmp/platform-migrations-$GITHUB_RUN_ID.tar.gz"

      - name: Backup, tạo platform DB, migrate và bật Google
        shell: bash
        run: |
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "GOOGLE_CLIENT_ID='$GOOGLE_CLIENT_ID' BOOTSTRAP_OWNER_EMAIL='$BOOTSTRAP_OWNER_EMAIL' bash '/tmp/enable-production-platform-auth-$GITHUB_RUN_ID.sh' '/tmp/platform-migrations-$GITHUB_RUN_ID.tar.gz'; status=\$?; rm -f '/tmp/enable-production-platform-auth-$GITHUB_RUN_ID.sh' '/tmp/platform-migrations-$GITHUB_RUN_ID.tar.gz'; exit \$status"

      - name: Kiểm tra website chính từ bên ngoài
        shell: bash
        run: |
          config=$(curl -fsS --max-time 20 https://tranchistudio.com/api/auth/config)
          [[ "$config" == *'"platformEnabled":true'* ]]
          [[ "$config" == *'"googleEnabled":true'* ]]
          [[ "$config" == *'"registrationEnabled":true'* ]]
          echo "Production Google login và đăng ký thành viên đã bật."
