# Bản xem thử theo Pull Request cho Amazing Studio.
#
# Mỗi PR: BUILD + TEST → dựng một app riêng trên Fly.io → dán link vào PR.
# Đóng PR: xoá hẳn app đó.
#
# KHÔNG đụng gì tới production: production trên VPS chỉ được deploy bằng workflow
# thủ công `Deploy VPS (code-only)` theo đúng commit SHA.

name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  # Push commit mới thì huỷ lượt đang chạy; nhưng KHÔNG huỷ lượt dọn dẹp khi đóng PR.
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

env:
  FLY_APP: pr-${{ github.event.pull_request.number }}-amazing-studio
  PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-amazing-studio.fly.dev

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. BUILD + TEST — đây là check bắt buộc phải XANH mới được Merge.
  # ───────────────────────────────────────────────────────────────────────────
  build-test:
    name: BUILD + TEST
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amazing_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amazing_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tenant_amazing_test
      DEFAULT_TENANT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tenant_amazing_test
      TENANT_B_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tenant_b_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-bytes
      BOOTSTRAP_OWNER_EMAIL: owner@gmail.com
      BOOTSTRAP_TENANT_STAFF_ID: "1"
      GOOGLE_CLIENT_ID: test-google-client.apps.googleusercontent.com
    outputs:
      api_tests: ${{ steps.test_api.outputs.count }}
      web_tests: ${{ steps.test_web.outputs.count }}
      typecheck_errors: ${{ steps.typecheck.outputs.errors }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cài đặt phụ thuộc (đúng y hệt pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Tạo hai tenant database cô lập cho integration test
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d amazing_platform_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tenant_amazing_test'
          psql -h 127.0.0.1 -U postgres -d amazing_platform_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tenant_b_test'

      - name: Migration platform test (không chạm production)
        env:
          PLATFORM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amazing_platform_test
        run: |
          pnpm --filter @workspace/platform-db migrate
          pnpm --filter @workspace/platform-db migrate

      - name: Typecheck platform database package
        run: pnpm --filter @workspace/platform-db typecheck

      - name: TEST — API (vitest)
        id: test_api
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server test 2>&1 | tee api-test.log
          # vitest in kèm mã màu ANSI → gỡ màu rồi mới bóc số.
          echo "count=$(sed 's/\x1b\[[0-9;]*m//g' api-test.log | grep -oE 'Tests +[0-9]+ passed' | grep -oE '[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: TEST — Platform auth integration + HTTP E2E
        env:
          PLATFORM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/amazing_platform_test
        run: pnpm --filter @workspace/api-server test:platform

      - name: TEST — Giao diện (vitest)
        id: test_web
        run: |
          set -o pipefail
          pnpm --filter @workspace/amazing-studio test 2>&1 | tee web-test.log
          echo "count=$(sed 's/\x1b\[[0-9;]*m//g' web-test.log | grep -oE 'Tests +[0-9]+ passed' | grep -oE '[0-9]+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: BUILD — api-server + giao diện (có chạy deploy-guard)
        run: pnpm run build:deploy

      # Typecheck CHỈ để cảnh báo: nhánh main hiện đã có sẵn 20 lỗi tsc từ trước
      # (5 file), nếu chặn merge thì mọi PR đều đỏ oan. Có số liệu để theo dõi giảm dần.
      - name: Typecheck (không chặn merge)
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          pnpm run typecheck > typecheck.log 2>&1
          echo "errors=$(grep -c 'error TS' typecheck.log)" >> "$GITHUB_OUTPUT"
          tail -30 typecheck.log

  # ───────────────────────────────────────────────────────────────────────────
  # 2. PREVIEW — chỉ chạy khi BUILD + TEST đã xanh.
  # ───────────────────────────────────────────────────────────────────────────
  preview:
    name: PREVIEW (Fly.io)
    needs: build-test
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra đã có đủ secret chưa
        run: |
          missing=""
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ];             then missing="$missing FLY_API_TOKEN"; fi
          if [ -z "${{ secrets.PREVIEW_DATABASE_URL }}" ];      then missing="$missing PREVIEW_DATABASE_URL"; fi
          if [ -z "${{ secrets.PREVIEW_DB_HOST_ALLOWLIST }}" ]; then missing="$missing PREVIEW_DB_HOST_ALLOWLIST"; fi
          if [ -z "${{ secrets.PREVIEW_SESSION_SECRET }}" ];    then missing="$missing PREVIEW_SESSION_SECRET"; fi
          if [ -z "${{ secrets.PREVIEW_BASIC_AUTH_PASS }}" ];   then missing="$missing PREVIEW_BASIC_AUTH_PASS"; fi
          if [ -n "$missing" ]; then
            echo "::error::Thiếu GitHub Secret:$missing — xem docs/PREVIEW-PR.md phần 'Cài đặt một lần'."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Tạo app preview cho PR này (nếu chưa có)
        run: |
          if flyctl status --app "$FLY_APP" >/dev/null 2>&1; then
            echo "App $FLY_APP đã tồn tại — sẽ deploy đè."
          else
            echo "Tạo app mới: $FLY_APP"
            flyctl apps create "$FLY_APP" --org "${{ vars.FLY_ORG || 'personal' }}"
          fi

      # PR #163 là staging review được chủ app đăng ký origin chính xác trong
      # Google Cloud. Tạo một platform database tách biệt ngay trên cụm preview;
      # tenant database vẫn là PREVIEW_DATABASE_URL hiện hữu.
      - name: Chuẩn bị platform database cho Google preview
        id: platform_db
        if: github.event.pull_request.number == 163
        env:
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          platform_db="amazing_platform_pr_${{ github.event.pull_request.number }}"
          exists=$(psql "$PREVIEW_DATABASE_URL" -Atqc "SELECT 1 FROM pg_database WHERE datname = '$platform_db'" || true)
          if [ "$exists" != "1" ]; then
            psql "$PREVIEW_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$platform_db\""
          fi

          platform_url=$(PLATFORM_DB="$platform_db" node -e '
            const u = new URL(process.env.PREVIEW_DATABASE_URL);
            u.pathname = `/${process.env.PLATFORM_DB}`;
            console.log(u.toString());
          ')
          echo "::add-mask::$platform_url"

          for migration in lib/platform-db/migrations/*.sql; do
            psql "$platform_url" -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done

          bootstrap_staff_id=$(psql "$PREVIEW_DATABASE_URL" -Atqc \
            "SELECT id FROM staff WHERE is_active = 1 AND (role = 'admin' OR roles::text LIKE '%admin%') ORDER BY id LIMIT 1")
          if ! [[ "$bootstrap_staff_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Không tìm thấy admin nghiệp vụ hợp lệ trong tenant database preview."
            exit 1
          fi

          echo "url=$platform_url" >> "$GITHUB_OUTPUT"
          echo "staff_id=$bootstrap_staff_id" >> "$GITHUB_OUTPUT"

      # Dynamic pr-N origins không thể được đăng ký trước một cách an toàn trong
      # Google Cloud. Preview hiện cũng chỉ có tenant DB ẩn danh, chưa có platform
      # DB riêng với marker/allowlist độc lập. Fly secrets tồn tại qua nhiều lần
      # deploy nên phải chủ động xóa cấu hình cũ và kiểm chứng lại (fail-closed).
      - name: Fail-closed Google và platform auth trên dynamic preview
        if: github.event.pull_request.number != 163
        run: |
          platform_names='^(PLATFORM_DATABASE_URL|DEFAULT_TENANT_DATABASE_URL|GOOGLE_CLIENT_ID|BOOTSTRAP_OWNER_EMAIL|BOOTSTRAP_TENANT_STAFF_ID)$'
          existing=$(flyctl secrets list --app "$FLY_APP" --json | jq -r '.[] | (.Name // .name)' | awk -v pattern="$platform_names" '$0 ~ pattern')
          if [ -n "$existing" ]; then
            mapfile -t names <<< "$existing"
            flyctl secrets unset --app "$FLY_APP" --stage "${names[@]}"
          fi
          remaining=$(flyctl secrets list --app "$FLY_APP" --json | jq -r '.[] | (.Name // .name)' | awk -v pattern="$platform_names" '$0 ~ pattern')
          if [ -n "$remaining" ]; then
            echo "::error::Không xóa được cấu hình platform/Google cũ khỏi dynamic preview. Từ chối deploy."
            exit 1
          fi

      - name: Nạp cấu hình bí mật cho bản xem thử
        if: github.event.pull_request.number != 163
        run: |
          flyctl secrets set --app "$FLY_APP" --stage \
            DATABASE_URL="${{ secrets.PREVIEW_DATABASE_URL }}" \
            PREVIEW_DB_HOST_ALLOWLIST="${{ secrets.PREVIEW_DB_HOST_ALLOWLIST }}" \
            SESSION_SECRET="${{ secrets.PREVIEW_SESSION_SECRET }}" \
            PREVIEW_BASIC_AUTH_USER="${{ vars.PREVIEW_BASIC_AUTH_USER || 'amazing' }}" \
            PREVIEW_BASIC_AUTH_PASS="${{ secrets.PREVIEW_BASIC_AUTH_PASS }}"

      - name: Bật Google login thật cho PR 163
        if: github.event.pull_request.number == 163
        env:
          GOOGLE_CLIENT_ID: 65788959851-t8edpkk8kql5ttpaln4nah5vjb4dumfb.apps.googleusercontent.com
          PLATFORM_DATABASE_URL: ${{ steps.platform_db.outputs.url }}
          BOOTSTRAP_TENANT_STAFF_ID: ${{ steps.platform_db.outputs.staff_id }}
        run: |
          set -euo pipefail
          bootstrap_owner_email=$(git log -1 --format='%ae' | tr '[:upper:]' '[:lower:]')
          case "$bootstrap_owner_email" in
            *@gmail.com) ;;
            *) echo "::error::Commit author email không phải Gmail hợp lệ để bootstrap OWNER."; exit 1 ;;
          esac

          flyctl secrets set --app "$FLY_APP" --stage \
            DATABASE_URL="${{ secrets.PREVIEW_DATABASE_URL }}" \
            PLATFORM_DATABASE_URL="$PLATFORM_DATABASE_URL" \
            DEFAULT_TENANT_DATABASE_URL="${{ secrets.PREVIEW_DATABASE_URL }}" \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            BOOTSTRAP_OWNER_EMAIL="$bootstrap_owner_email" \
            BOOTSTRAP_TENANT_STAFF_ID="$BOOTSTRAP_TENANT_STAFF_ID" \
            PLATFORM_DB_POOL_MAX="2" \
            PREVIEW_DB_HOST_ALLOWLIST="${{ secrets.PREVIEW_DB_HOST_ALLOWLIST }}" \
            SESSION_SECRET="${{ secrets.PREVIEW_SESSION_SECRET }}" \
            PREVIEW_BASIC_AUTH_USER="${{ vars.PREVIEW_BASIC_AUTH_USER || 'amazing' }}" \
            PREVIEW_BASIC_AUTH_PASS="${{ secrets.PREVIEW_BASIC_AUTH_PASS }}"

      - name: Dựng bản xem thử
        id: deploy
        run: |
          # flyctl thỉnh thoảng đứt kết nối tới api.machines.dev giữa chừng ("gave up
          # after 15 attempts", 31/07) làm deploy fail dù app đã lên — thử lại 1 lần.
          deploy() { flyctl deploy --app "$FLY_APP" --config fly.toml --remote-only --ha=false --wait-timeout 300; }
          deploy || { echo "::warning::flyctl deploy lỗi lần 1 (thường do mạng thoáng qua) — thử lại sau 20 giây"; sleep 20; deploy; }
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      # Bằng chứng bản xem thử THỰC SỰ chạy: gọi /api/healthz (path này được miễn
      # mật khẩu). Nếu chốt an toàn chặn khởi động (DB sai allowlist…) thì app không
      # lên và bước này sẽ đỏ → PR không được coi là sẵn sàng.
      - name: Xác nhận bản xem thử đã sống
        run: |
          for i in $(seq 1 20); do
            body=$(curl -sS --max-time 15 "$PREVIEW_URL/api/healthz" || true)
            echo "lần $i: $body"
            case "$body" in *'"status":"ok"'*) echo "Bản xem thử đã sẵn sàng."; exit 0;; esac
            sleep 10
          done
          echo "::error::Bản xem thử không phản hồi /api/healthz sau ~200 giây."
          exit 1

      # Khi BẤT KỲ bước nào phía trên hỏng (deploy hoặc xác nhận sống): in trạng
      # thái + log máy để thấy NGAY nguyên nhân trong CI, không phải mò dashboard.
      # Phải đặt SAU bước xác nhận — if:failure() chỉ nhìn các bước TRƯỚC nó.
      - name: Log máy chủ khi hỏng
        if: failure()
        run: |
          echo "===== TRẠNG THÁI MÁY ====="
          flyctl status --app "$FLY_APP" || true
          echo "===== LOG KHỞI ĐỘNG (120 dòng cuối) ====="
          flyctl logs --app "$FLY_APP" --no-tail 2>/dev/null | tail -120 || true

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Bình luận trạng thái vào PR (luôn chạy, kể cả khi có bước hỏng).
  # ───────────────────────────────────────────────────────────────────────────
  comment:
    name: Cập nhật bình luận trong PR
    needs: [build-test, preview]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          PREVIEW: ${{ needs.preview.result }}
          API_TESTS: ${{ needs.build-test.outputs.api_tests }}
          WEB_TESTS: ${{ needs.build-test.outputs.web_tests }}
          TS_ERRORS: ${{ needs.build-test.outputs.typecheck_errors }}
          URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const MARKER = '<!-- amazing-studio-preview -->';
            const { BUILD_TEST, PREVIEW, API_TESTS, WEB_TESTS, TS_ERRORS, URL } = process.env;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const ok = (r) => r === 'success';

            const lines = [MARKER, '## 📱 Bản xem thử cho PR này', ''];

            if (ok(BUILD_TEST)) {
              lines.push('✅ **BUILD** — api-server + giao diện build sạch');
              lines.push(`✅ **TEST** — API ${API_TESTS || '?'} bài · Giao diện ${WEB_TESTS || '?'} bài, tất cả PASS`);
            } else {
              lines.push('❌ **BUILD / TEST HỎNG**');
              lines.push(`👉 [Bấm xem log lỗi](${run})`);
            }

            if (ok(PREVIEW)) {
              lines.push('✅ **PREVIEW READY**');
              lines.push('');
              lines.push(`### 🔗 [OPEN PREVIEW APP](${URL})`);
              lines.push('');
              lines.push('> Mở link bằng iPhone. Trang sẽ hỏi mật khẩu xem thử một lần (mở bằng trình duyệt nào cũng được).');
              lines.push('> Dữ liệu trong bản xem thử **đã che tên/SĐT/email khách** và **không nối vào database production**.');
              lines.push('> Google/platform auth được **cố ý tắt** trên hostname PR động; preview này chỉ kiểm tra local login. Google thật chỉ kiểm tra trên staging cố định, DB test riêng.');
            } else if (PREVIEW === 'skipped') {
              lines.push('⛔ **CHƯA DỰNG ĐƯỢC BẢN XEM THỬ** — vì BUILD/TEST chưa xanh.');
              lines.push('');
              lines.push('**ĐỪNG MERGE.** Sửa lỗi rồi push lại, bản xem thử sẽ tự dựng lại.');
            } else {
              lines.push('❌ **DỰNG BẢN XEM THỬ THẤT BẠI**');
              lines.push(`👉 [Bấm xem log lỗi](${run})`);
              lines.push('');
              lines.push('**ĐỪNG MERGE.**');
              lines.push('');
              lines.push('<sub>Nếu Fly.io/Neon/GitHub Secrets chưa cấu hình xong thì đây là chuyện bình thường — xem `docs/PREVIEW-PR.md`, phần “Cài đặt một lần”.</sub>');
            }

            if (TS_ERRORS && TS_ERRORS !== '0') {
              lines.push('');
              lines.push(`<sub>ℹ️ Typecheck: ${TS_ERRORS} lỗi tsc (nợ cũ của main, không chặn merge).</sub>`);
            }
            lines.push('');
            lines.push(`<sub>Commit \`${sha}\` · cập nhật tự động mỗi lần push · [log](${run})</sub>`);

            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Đóng PR → xoá hẳn app preview (không để tốn tiền).
  # ───────────────────────────────────────────────────────────────────────────
  destroy:
    name: Dọn bản xem thử
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Xoá app preview của PR
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "Chưa cấu hình FLY_API_TOKEN — bỏ qua."; exit 0; fi
          flyctl apps destroy "$FLY_APP" --yes || echo "Không có app $FLY_APP để xoá."
